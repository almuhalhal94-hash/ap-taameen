name: إرسال إشعارات المعلمين
on:
  schedule:
    # كل 5 دقائق من 6 الصبح إلى 9 الليل بتوقيت البحرين، السبت إلى الخميس
    - cron: '*/5 3-17 * * 0-4,6'
  workflow_dispatch:
concurrency: { group: push-send, cancel-in-progress: false }
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: tools/push }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save firebase-admin@12
      - run: node tools/push/send.mjs
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
