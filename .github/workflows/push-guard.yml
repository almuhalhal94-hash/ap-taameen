name: حارس إشعارات المعلمين
# يراقب السحابة لحظيًا ويرسل إشعار لكل معلم (تأمين، تبديل، تحديث، إلغاء، تذكير، رسائل الإدارة)
# يشتغل على مدار الساعة: كل تشغيلة (~5:45 ساعة) تشغّل اللي بعدها بنفسها. الجدول تحت احتياط فقط لو انقطعت السلسلة.
# الكود في فرع العمل: tools/push
# موقوف: المستودع خاص ودقائق GitHub المجانية (2000/شهر) ما تكفي حارس على مدار الساعة.
# يشتغل بس يدويًا (workflow_dispatch) لين نلقى بديل.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency: { group: push-guard, cancel-in-progress: false }
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/beautiful-planck-y0yu0f
          sparse-checkout: tools/push
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save firebase-admin@12
      - run: node tools/push/guard.mjs
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          REPO: ${{ github.repository }}
