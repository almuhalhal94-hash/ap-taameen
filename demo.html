<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تجربة تطبيق التأمين — المعلم والمشرف والإداري</title>
<style>
@font-face{font-family:"Readex";font-weight:600;src:url(assets/fonts/readex-pro-arabic-600-normal.woff2) format("woff2")}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#140c0b;color:#f5ece2;font-family:"Readex",system-ui,sans-serif}
.top{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px;background:#1d1210;border-bottom:1px solid #3e2a24}
.top b{color:#f6d690;margin-inline-end:6px}
.top button{font:inherit;font-size:.9rem;border:1px solid #3e2a24;background:#26181a;color:#f5ece2;border-radius:999px;padding:7px 16px;cursor:pointer}
.top button.on{background:linear-gradient(135deg,#ce1126,#7a0a16);border-color:transparent}
.top .reset{background:none;color:#b4a194;font-size:.8rem}
.hint{text-align:center;font-size:.8rem;color:#b4a194;padding:6px 12px}
.stage{display:flex;gap:18px;justify-content:center;align-items:flex-start;padding:10px;height:calc(100% - 96px)}
.pane{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.pane h3{margin:0;font-size:.9rem;color:#f6d690}
.phone{width:390px;height:100%;max-height:820px;border:10px solid #000;border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 2px #3e2a24}
.desk{width:min(760px,calc(100vw - 880px));min-width:520px;height:100%;border-radius:14px;overflow:hidden;border:1px solid #3e2a24}
iframe{width:100%;height:100%;border:0;background:#fff}
@media (max-width:1300px){
  .stage{display:block;padding:0;height:calc(100% - 96px)}
  .pane{display:none;height:100%}
  .pane.show{display:flex}
  .pane h3{display:none}
  .phone,.desk{width:100%;max-height:none;min-width:0;border:0;border-radius:0;box-shadow:none}
}
@media (min-width:1301px){ .top .tabs{display:none} }
</style>
</head>
<body>
<div class="top">
  <b>تجربة التطبيق الثلاثي</b>
  <span class="tabs"><button data-p="t" class="on">جوال المعلم</button> <button data-p="s">جوال المشرف</button> <button data-p="a">الإداري</button></span>
  <button class="reset" id="reset">↺ إعادة التجربة</button>
</div>
<p class="hint">جرّب: اسحب بطاقة المعلم يمين (قبول) أو يسار (اعتذار)، وشوف الرد يطلع عند الإداري والمشرف مباشرة. وجرّب المحادثة والاستيضاح.</p>
<div class="stage">
  <div class="pane show" data-p="t"><h3>جوال المعلم — أ. يعقوب علي</h3><div class="phone"><iframe id="ft" title="المعلم"></iframe></div></div>
  <div class="pane" data-p="s"><h3>جوال المشرف — أ. وليد جاد</h3><div class="phone"><iframe id="fs" title="المشرف"></iframe></div></div>
  <div class="pane" data-p="a"><h3>الإداري — تبويب «ردود المعلمين»</h3><div class="desk"><iframe id="fa" title="الإداري"></iframe></div></div>
</div>
<script>
(() => {
  const pad = n => String(n).padStart(2, '0'), d = new Date();
  const TODAY = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const DAY = new Intl.DateTimeFormat('ar', { weekday: 'long' }).format(d);
  const names = { t1: 'أ. يعقوب علي', t2: 'أ. فلاح طايل', t4: 'أ. عمر محمد إرشاد', t39: 'أ. حسين الحوري' };
  const base = (kind, slot, slotName, time, c, label, extra) => ({ date: TODAY, day: DAY, kind, absent: 't3', absentName: 'أ. طلال سعود', slot, slotName, time, c, label,
    to: 't1', toName: names.t1, status: 'pending', auto: false, refused: [], log: [], backups: ['t2', 't4', 't39'], names, sups: ['t26'], createdAt: Date.now(), updatedAt: Date.now(), ...extra });
  function seed() {
    const data = {
      people: { 'demo-t1': { tid: 't1', name: names.t1, sup: false }, 'demo-t26': { tid: 't26', name: 'أ. وليد جاد', sup: true, supLabel: 'أول إعدادي' } },
      assign: {
        [`${TODAY}_cover_t3_2`]: base('cover', '2', 'الثانية', '8:10–8:55', '3ع1', 'حصة'),
        [`${TODAY}_duty_t3_B1`]: base('duty', 'B1', 'الفسحة الأولى', '8:55–9:25', '', 'مراقبة — السور الشرقي (المسجد)'),
        [`${TODAY}_swap_t3_6`]: base('swap', '6', 'السادسة', '11:40–12:25', '1ع1', 'حصة', { absentName: 'أ. طلال سعود', s2: '4', s2Name: 'الرابعة', s2Time: '10:10–10:55', backups: [{ b: 't2', s2: '5', s2Name: 'الخامسة', s2Time: '10:55–11:40' }] })
      },
      explain: {}, msgs: { m1: { tid: 't1', from: 'admin', text: 'السلام عليكم أستاذ يعقوب، عندك تأمين اليوم، الله يعطيك العافية.', at: Date.now() - 60000, readA: true, readT: false } }
    };
    try { localStorage.setItem('apt-sync-demo', JSON.stringify(data)); localStorage.removeItem('apt-seen-t1'); localStorage.removeItem('apt-seen-t26'); localStorage.setItem('ap-taameen-v1-tab', 'app'); } catch (e) { }
    document.getElementById('ft').src = 'app/index.html#k-demo-t1';
    document.getElementById('fs').src = 'app/index.html#k-demo-t26';
    document.getElementById('fa').src = 'index.html';
  }
  seed();
  document.getElementById('reset').onclick = () => { ['ft', 'fs', 'fa'].forEach(i => document.getElementById(i).src = 'about:blank'); setTimeout(seed, 100); };
  document.querySelector('.tabs').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    document.querySelectorAll('.pane').forEach(p => p.classList.toggle('show', p.dataset.p === b.dataset.p));
  };
})();
</script>
</body>
</html>
